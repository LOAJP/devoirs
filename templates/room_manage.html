<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自习室管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">自习室管理后台</span>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="{{ url_for('admin_index') }}">首页</a>
            <a class="nav-link text-white" href="{{ url_for('room_manage') }}">自习室管理</a>
            <a class="nav-link text-white" href="{{ url_for('seat_manage') }}">座位管理</a>
            <a class="nav-link text-white" href="{{ url_for('admin_reservations') }}">预约记录</a>
            <a class="nav-link text-white" href="{{ url_for('logout') }}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card mb-4">
        <div class="card-header">新增自习室</div>
        <div class="card-body">
            <form method="post" action="{{ url_for('room_add') }}" class="row g-2">
                <div class="col-md-4">
                    <input class="form-control" name="room_name" placeholder="自习室名称" maxlength="100" required>
                </div>
                <div class="col-md-5">
                    <input class="form-control" name="remark" placeholder="备注（可空）" maxlength="200">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100">新增</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-bordered bg-white align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>名称</th>
            <th>备注</th>
            <th>座位数</th>
            <th style="width: 260px;">操作</th>
        </tr>
        </thead>
        <tbody>
        {% for room in rooms %}
        <tr>
            <td>{{ room.room_id }}</td>
            <td>
                <input class="form-control form-control-sm" name="room_name" value="{{ room.room_name }}"
                       maxlength="100" form="edit{{ room.room_id }}">
            </td>
            <td>
                <input class="form-control form-control-sm" name="remark" value="{{ room.remark or '' }}"
                       maxlength="200" form="edit{{ room.room_id }}">
            </td>
            <td>{{ room.seat_count }}</td>
            <td>
                <form method="post" action="{{ url_for('room_edit') }}" id="edit{{ room.room_id }}" class="d-inline">
                    <input type="hidden" name="room_id" value="{{ room.room_id }}">
                    <button class="btn btn-sm btn-outline-primary">保存修改</button>
                </form>
                <form method="post" action="{{ url_for('room_delete', room_id=room.room_id) }}"
                      class="d-inline" onsubmit="return confirm('确定删除该自习室？');">
                    <button class="btn btn-sm btn-outline-danger">删除</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-muted">暂无自习室</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% set msgs = get_flashed_messages() %}
<script>
    var msgs = {{ msgs|tojson }};
    msgs.forEach(function (m) { alert(m); });
</script>
</body>
</html>
