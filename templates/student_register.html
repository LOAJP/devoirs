<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生注册 - 自习室座位预约</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 420px; margin-top: 70px;">
    <h4 class="text-center mb-4">学生注册</h4>
    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">账号</label>
                    <input class="form-control" name="username" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" name="password" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">姓名</label>
                    <input class="form-control" name="student_name" maxlength="50" required>
                </div>
                <button class="btn btn-success w-100">注册</button>
            </form>
            <div class="text-center small mt-3">
                <a href="{{ url_for('student_login') }}">已有账号？去登录</a>
                <span class="text-muted mx-1">·</span>
                <a href="{{ url_for('index') }}">返回首页</a>
            </div>
        </div>
    </div>
</div>

{% set msgs = get_flashed_messages() %}
<script>
    var msgs = {{ msgs|tojson }};
    msgs.forEach(function (m) { alert(m); });
</script>
</body>
</html>
