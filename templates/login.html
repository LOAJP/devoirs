<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 自习室座位预约系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 460px; margin-top: 50px;">
    <h4 class="text-center mb-4">校园自习室座位预约系统</h4>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-info py-2">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- 学生登录 -->
    <div class="card mb-3">
        <div class="card-header">学生登录</div>
        <div class="card-body">
            <form method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="role" value="student">
                <div class="mb-2">
                    <label class="form-label">账号</label>
                    <input class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button class="btn btn-primary w-100">登录</button>
            </form>
        </div>
    </div>

    <!-- 学生注册 -->
    <div class="card mb-3">
        <div class="card-header">学生注册</div>
        <div class="card-body">
            <form method="post" action="{{ url_for('register') }}">
                <div class="mb-2">
                    <label class="form-label">账号</label>
                    <input class="form-control" name="username" maxlength="50" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" name="password" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">姓名</label>
                    <input class="form-control" name="student_name" maxlength="50" required>
                </div>
                <button class="btn btn-success w-100">注册</button>
            </form>
        </div>
    </div>

    <!-- 管理员登录 -->
    <div class="card">
        <div class="card-header">管理员登录</div>
        <div class="card-body">
            <form method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="role" value="admin">
                <div class="mb-2">
                    <label class="form-label">账号</label>
                    <input class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button class="btn btn-dark w-100">登录</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
