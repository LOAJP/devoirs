<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员首页 - 自习室座位预约</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">自习室管理后台</span>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="{{ url_for('admin_index') }}">首页</a>
            <a class="nav-link text-white" href="{{ url_for('room_manage') }}">自习室管理</a>
            <a class="nav-link text-white" href="{{ url_for('seat_manage') }}">座位管理</a>
            <a class="nav-link text-white" href="{{ url_for('admin_reservations') }}">预约记录</a>
            <a class="nav-link text-white" href="{{ url_for('logout') }}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-info py-2">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h5 class="mb-3">注册学生账号列表</h5>
    <table class="table table-bordered bg-white">
        <thead>
        <tr>
            <th>学生ID</th>
            <th>账号</th>
            <th>姓名</th>
        </tr>
        </thead>
        <tbody>
        {% for s in students %}
        <tr>
            <td>{{ s.student_id }}</td>
            <td>{{ s.username }}</td>
            <td>{{ s.student_name }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-muted">暂无注册学生</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
